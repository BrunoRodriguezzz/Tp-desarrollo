server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy to external API to avoid CORS and keep same-origin for /api/*
    location /api/ {
        proxy_pass https://tiendasolapi.syspa.es;
        proxy_set_header Host tiendasolapi.syspa.es;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name tiendasolapi.syspa.es;
        proxy_read_timeout 90s;
        proxy_connect_timeout 30s;
        proxy_set_header Connection "";
    }

    # Serve index.html for all non-file routes (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: let nginx serve and cache them
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|ttf|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Optionally reduce logging for favicons/robots
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
