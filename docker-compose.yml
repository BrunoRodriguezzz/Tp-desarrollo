version: '3.8'

services:
  backend:
    build:
      context: ./packages/backend
    restart: unless-stopped
    # Load environment variables from the local backend .env file
    env_file:
      - ./packages/backend/.env
    environment:
      - NODE_ENV=production
      # Add your DB connection string as env var, for example:
      # - MONGO_URL=mongodb://mongo:27017/tienda
    ports:
      - "5000:3000" # host:container (backend listens on 3000 inside)
    networks:
      - tienda-net

  frontend:
    build:
      context: ./packages/frontend
    restart: unless-stopped
    ports:
      - "3000:80" # map nginx 80 -> host 3000 so CORS origin http://localhost:3000 works
    depends_on:
      - backend
    networks:
      - tienda-net

networks:
  tienda-net:
    driver: bridge
